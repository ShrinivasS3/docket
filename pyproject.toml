[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docket-cli"
version = "0.1.0"
description = "A lab notebook your coding agent reads: flat-vault research log CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
docket = "docket.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docket"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
